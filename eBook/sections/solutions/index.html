<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8">
    <title>Cardano Wallet Balance</title>
  </head>
  <body>
    <button id="connect">Connect Wallet</button>
    <button id="show">Show Balance</button>
    <div id="balance"></div>

    <script type="module">
        // MeshJS loaded from a CDN for this simple example.
        // In a real project install it with: npm install @meshsdk/core
        import { BrowserWallet } from "https://esm.sh/@meshsdk/core";

        let wallet;

        // Enable Cardano wallet
        document.getElementById('connect').addEventListener('click', async () => {
            wallet = await BrowserWallet.enable('eternl');
        });

        // Get wallet balance
        document.getElementById('show').addEventListener('click', async () => {
            const lovelace = await wallet.getLovelace();

            // Display balance on the page (1 ADA = 1,000,000 lovelace)
            document.getElementById('balance').innerText =
                `Wallet Balance: ${Number(lovelace) / 1_000_000} ADA`;
        });
    </script>
  </body>
</html>
